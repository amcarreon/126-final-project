<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../assets/css/auth.css">
        <title>Authentication Page</title>
    </head>
    <body>
        <br><br><br><br><br><br><br><br><br><br>

        <div class="signUpBox" id="signUpBox">
            <h1 class="signUpTitle">Get Started!</h1>
            <form class="signUp" id="signUp">
                <input type="text" id="register_name" name="register_name" placeholder="Name" required>
                <br><br>
                <input type="email" id="register_email" name="register_email" placeholder="Email" required>
                <br><br>

                <!-- Password field with toggle -->
                <div class="password-container">
                    <input type="password" id="register_password" name="register_password" placeholder="Password" required>
                    <button type="button" id="toggle_password" class="toggle-btn">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Password requirements list -->
                <div class="password-requirements">
                    <p>Password requirements:</p>
                    <ul>
                        <li class="requirement" id="length-check">At least 8 characters</li>
                        <li class="requirement" id="uppercase-check">One uppercase letter</li>
                        <li class="requirement" id="number-check">One number</li>
                        <li class="requirement" id="special-check">One special character</li>
                    </ul>
                </div>
                <br>

                <!-- Error/success messages -->
                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <button type="submit" id="register_button" class="register_button" disabled>Create Account</button>
                
            </form>
            <h4>Already signed up? <a href="login_form.php" class="link">Log in</a></h4>
        </div>

        <script src="../../assets/js/main.js" defer></script>
    </body>
</html>
