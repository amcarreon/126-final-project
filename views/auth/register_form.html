<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../assets/css/auth.css">
        <script src="../../assets/js/main.js" defer></script>

        <title>Authentication Page</title>
    </head>
    <body>
        <div class="appDiv">
            <header >
                <h1 class="appName">ByteXpress</h1>
            </header>
        </div>
        <div class="signUpBox" id="signUpBox">
            <h1 class="signUpTitle">Get Started!</h1>
            <form class="signUp">
                <input type="text" id="name" name="name" placeholder="Name" required>
                <br><br>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <br><br>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <br><br>
                <button type="submit" class="button">Create Account</button>
                
            </form>
        <h4>Already signed up? <a href="login_form.html" class="link">Log in</a></h4>
        </div>


        <template>
            <form class="signUp">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <br><br>
            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number">
            <br><br>
            <button type="submit" class="button">Sign Up</button>
        </form>
        </template>

    </body>
</html>
