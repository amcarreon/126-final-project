<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/126-final-project/assets/css/auth.css">
    <title>Admin Login</title>
</head>
<body>
    <h1>Admin Login</h1>

    <p id="loginError" class="error-message" hidden>Invalid password. Try again.</p>

    <form method="post" action="/126-final-project/pages/admin/login.php">
        <label for="admin_password">Password</label>
        <input type="password" id="admin_password" name="admin_password" required autocomplete="current-password">
        <br><br>
        <button type="submit">Login</button>
    </form>

    <script>
        if (new URLSearchParams(window.location.search).get("error") === "1") {
            document.getElementById("loginError").hidden = false;
        }
    </script>
</body>
</html>
