<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Store Profile</title>
    </head>
    <body>
        <div class="storeProfile" id="storeProfileID">
            <header>
                <div class="imgDiv">
                    <img src="" alt="Store Image" class="storeImage">
                </div>
                <h1 class="storeName" id="storeNameID">Store Name</h1>
            </header>
            <section class="contactInfo" id="contactInfoID">
                <h2>Contact Information</h2>
                <p id="contactInfoDetails"></p>
            </section>
            <section class="socialMediaProfiles" id="socialMediaProfilesID">
                <h2>Social Media Profiles</h2>
                <ul id="socialMediaProfilesList"></ul>
            </section>
            <section class="location" id="locationID">
                <h2>Location</h2>
                <p id="locationDetails"></p>
            </section>
            <button class="editProfileButton">Edit Profile</button>
        </div>

        <template id="storeProfileTemplate">
            <form class="editProfileInfo">
                <input type ="url" id="storeImageURL" name="storeImageURL" placeholder="Store Image URL">
                <label for="storeName">Store Name</label>
                <input type="text" id="storeName" name="storeName" placeholder="Store Name">
                <label for="contactInfo">Contact Information</label>
                <input type="tel" id="contactInfo" name="contactInfo" placeholder="Contact Information">
                <label for="socialMediaProfiles">Social Media Profiles</label>
                <input type="text" id="socialMediaProfiles" name="socialMediaProfiles" placeholder="Social Media Profiles (comma separated)">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" placeholder="Location">
                <button type="submit">Save Changes</button>
                <button type="button" id="cancelEdit">Cancel</button>
            </form>
        </template>
    <script src="../../assets/js/load_shop_info.js"></script>
    </body>
</html>
