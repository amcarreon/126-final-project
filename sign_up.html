<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="authentication_style.css">
        <title>Authentication Page</title>
    </head>
    <body>
        <div class="appDiv">
            <header >
                <h1 class="appName">ByteExpress</h1>
            </header>
        </div>
        <div class="signUpBox" id="signUpBox">
            <h1 class="signUpTitle">Welcome!</h1>
            <form class="signUp">
                <input type="email" id="email" name="email" placeholder="Email">
                <br><br>
                <input type="password" id="password" name="password" placeholder="Password">
                <br><br>
                <p class="role">Role</p>
                <div class="roles">
                    <input type="radio" id="seller" class="seller" name="seller" value="seller">
                    <label for="seller">Seller</label><br><br>
                    <input type="radio" id="buyer" class="buyer" name="buyer" value="buyer">
                    <label for="buyer">Buyer</label><br>
                </div>
  
                <br><br>
                <button type="submit" class="button">Sign Up</button>
                
            </form>
        <h4>Already signed up? <a href="log_in.html" class="link">Log in</a></h4>
        </div>


        <template>
            <form class="signUp">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <br><br>
            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number">
            <br><br>
            <button type="submit" class="button">Sign Up</button>
        </form>
        </template>

    </body>
</html>
