<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../assets/css/shop_profile.css">
        <script src="../../assets/js/shop_services_form.js" defer></script>
        <title>Laundry Services</title>
    </head>
    <body>
        <h1 class="laundryTitle">Laundry Services</h1>

            <div class="servicesBox">
                <form class="serviceForm">
                    <input type="text" id="serviceName" name="serviceName" placeholder="Service Name" required>
                    <br><br>
                    <input type="text" id="serviceDesciption" name="serviceDescription" placeholder="Description">
                    <br><br>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">Service Description</th>
                                <th style="text-align: left;">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <input type="text" id="serviceName" name="serviceName"  required>
                                </td>
                                <td>
                                    <input type="number" id="servicePrice" name="servicePrice" placeholder="0.00" step="0.01" required>
                                </td>
                                <td>
                                    <button class="btn-edit" onclick="editRow()">Edit</button>
                                    <button class="btn-delete" onclick="removeRow()">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <button id="addRowBtn" onclick="addRow()">Add New Row</button>
                    <br><br>
                    
                    <button type="submit" class="submit-btn">Add Service</button>&nbsp;
                    <button type="cancel" class="cancel-btn">Cancel</button>
                </form>
            </div>
    </body>
</html>
