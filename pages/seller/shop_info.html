<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="shop_info.css">
        <title>Store Profile</title>
    </head>
    <body>
        <div class="storeProfile" id="storeProfileID">
            <form>
                <div class="imgDiv">
                    <label for="file-upload" class="customUpload">Click to upload shop profile picture</label>
                    <input id="file-upload" type="file" style="display:none;">
                </div>
                <br><br>

                <div class="NameDiv">
                    <input type="text" id="storeName" name="storeName" placeholder="Store Name">
                </div>
                <div class="descriptionDiv">
                    <input type="text" id="storeDescription" name="storeDescription" placeholder="Store Description">
                </div>        
            <input type="tel" id="contactInfo" name="contactInfo" placeholder="Contact Information">
            
            <input type="text" id="socialMediaProfiles" name="socialMediaProfiles" placeholder="Social Media Profiles ">
            <input type="text" id="location" name="location" placeholder="Location">
            <button type="submit" class="submit">Save Changes</button>
            <button type="button" id="cancelEdit">Cancel</button>
        </div>

            </form>
            
</body>
</html>
