<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Store Location | My Brand</title>
        <script src="../../assets/js/map.js"></script>
        <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDRZdRqT2q_dk5O7Vt_UZ6hqvol5-UKfP8&loading=async&callback=initMap" async defer></script>
        <style>
            #map {
                width: 100%;
                height: 400px;
                background-color: #e5e3df;
            }
        </style>
    
    </head>
    <body>
        <main class="location-container">
            <h1>Store Location</h1>
            <div id="map" role="region" aria-label="Interactive Map"></div>
            <div class="details-wrapper">
                <p id="location-status">Detecting your location...</p>
                <p id="address-display"></p>
            </div>
        </main>
</body>
</html>
