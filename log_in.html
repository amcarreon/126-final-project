<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="authentication_style.css">
        <title>Authentication Page</title>
    </head>
    <body>
        <div class="appDiv">
            <header >
                <h1 class="appName">ByteExpress</h1>
            </header>
        </div>
        <h1 class="logInTitle">Log In</h1>
        <div class="logInBox" id="logInBox">
            <form class="logIn">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
                <br><br>
                <label for="password">Password:</label>
                <input type="text" id="password" name="password" placeholder="Enter your password"><!--Should have a verifcation password-->
                <br><br>
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number"><!--Should have a verifcation password-->
                <br><br>


        </form>
        <h3>Don't have an account? <a href="sign_up.html" class="link">Sign Up</a></h3>
        </div>
    </body>
</html>
