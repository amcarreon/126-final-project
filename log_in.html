<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="authentication_style.css">
        <title>Authentication Page</title>
    </head>
    <body>
        <div class="appDiv">
            <header >
                <h1 class="appName">ByteExpress</h1>
            </header>
        </div>
        
        <div class="logInBox" id="logInBox">
            <h1 class="logInTitle">Welcome Back!</h1>
            <form class="logIn">
                <input type="email" id="email" name="email" placeholder="Email">
                <br><br>
                <input type="password" id="password" name="password" placeholder="Password">
                <br><br>
                <p class="role">Role</p>
                <div class="roles">
                    <input type="radio" id="seller" class="seller" name="seller" value="seller">
                    <label for="seller">Seller</label><br><br>
                    <input type="radio" id="buyer" class="buyer" name="buyer" value="buyer">
                    <label for="buyer">Buyer</label><br>
                </div>
  
                <br><br>
                <button type="submit" class="button">Log In</button>
            </form>
            
        <h4>Don't have an account? <a href="sign_up.html" class="link">Sign Up</a></h4>
        </div>
    </body>
</html>
